name: Monitor de streams Radiocol

on:
  schedule:
    - cron: "17 8 * * *"      # todo dia às 05:17 (horário de Brasília)
    - cron: "17 17 * * *"     # e às 14:17 (mutirão: dá conta da fila de busca mais rápido)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora
    inputs:
      limit_posts:
        description: "Limitar a N posts (0 = todos) — útil para teste"
        default: "0"

permissions:
  contents: write              # para gravar radios.json e o estado no repositório

concurrency:
  group: radiocol-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Navegador de verdade (Chromium) para sites com player montado por JavaScript
      - name: Instalar navegador (Chromium)
        run: python -m playwright install --with-deps chromium

      - name: Verificar posts e streams
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.radiocol.com.br' }}
          LIMIT_POSTS: ${{ github.event.inputs.limit_posts || '0' }}
          CONFIRM_RUNS: ${{ vars.CONFIRM_RUNS || '2' }}
          REPORT_URL: ${{ vars.REPORT_URL }}
          EMAIL_ALWAYS: ${{ vars.EMAIL_ALWAYS || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m monitor.run

      - name: Salvar resultados no repositório
        run: |
          git config user.name  "radiocol-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualização diária dos streams ($(date -u +%F))"
            git pull --rebase -X theirs || git pull --rebase
            git push
          fi

      - name: Limpar cache do jsDelivr (se usar jsDelivr em vez do GitHub Pages)
        if: ${{ vars.USE_JSDELIVR == 'true' }}
        run: |
          for i in $(seq -w 0 31); do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/docs/r/$i.json" > /dev/null
          done
