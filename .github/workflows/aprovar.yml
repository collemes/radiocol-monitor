name: Aplicar solicitação aprovada

# Disparado pela planilha de aprovação (Apps Script) quando você escolhe "Aprovar"
on:
  repository_dispatch:
    types: [aplicar-solicitacao]
  workflow_dispatch:
    inputs:
      request_json:
        description: 'JSON da solicitação (teste manual)'
        required: true

permissions:
  contents: write

concurrency:
  group: radiocol-monitor        # nunca roda junto com o monitor diário
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Aplicar
        env:
          # o conteúdo vai por variável de ambiente (nunca colado no comando) — evita injeção
          REQUEST_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || github.event.inputs.request_json }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.radiocol.com.br' }}
        run: python -m monitor.apply

      - name: Salvar no repositório
        run: |
          git config user.name  "radiocol-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Solicitação aprovada: ${REQ_ID:-manual}"
          git pull --rebase
          git push
        env:
          REQ_ID: ${{ github.event.client_payload.id }}

      - name: Limpar cache do jsDelivr
        if: ${{ vars.USE_JSDELIVR == 'true' }}
        run: |
          for i in $(seq -w 0 31); do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/docs/r/$i.json" > /dev/null
          done
